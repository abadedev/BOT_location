<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#f5f7fa">
  <title>Enviar Localização - DS Tech</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --border: #e0e5eb;
      --accent: #2fc6f6;
      --accent-hover: #1ab0e0;
      --text-primary: #1a1a2e;
      --text-secondary: #6b7280;
      --success: #22c55e;
      --error: #ef4444;
      --radius: 12px;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      overflow-x: hidden;
    }

    .container {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding: 0 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 24px 0 16px;
      border-bottom: 1px solid var(--border);
    }

    .header-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .header-title svg { width: 22px; height: 22px; fill: var(--accent); }

    .header-greeting {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 6px;
      font-weight: 500;
    }

    /* Manual name input */
    .name-input-wrapper {
      margin-top: 10px;
      display: none;
    }
    .name-input-wrapper.visible { display: block; }
    .name-input-wrapper input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: var(--card);
      color: var(--text-primary);
      outline: none;
      text-align: center;
    }
    .name-input-wrapper input:focus { border-color: var(--accent); }

    /* Status Area */
    .status-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      min-height: 180px;
    }

    .status-icon {
      width: 80px; height: 80px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .status-icon svg { width: 40px; height: 40px; }

    .status-icon.idle {
      background: var(--card);
      border: 2px dashed var(--border);
      box-shadow: var(--shadow);
    }
    .status-icon.idle svg { fill: var(--text-secondary); }

    .status-icon.locating {
      background: rgba(47,198,246,0.12);
      border: 2px solid var(--accent);
      animation: pulse 1.5s infinite;
    }
    .status-icon.locating svg { fill: var(--accent); animation: spin 2s linear infinite; }

    .status-icon.sending {
      background: rgba(47,198,246,0.12);
      border: 2px solid var(--accent);
      animation: pulse 1s infinite;
    }
    .status-icon.sending svg { fill: var(--accent); }

    .status-icon.success {
      background: rgba(34,197,94,0.12);
      border: 2px solid var(--success);
    }
    .status-icon.success svg { fill: var(--success); }

    .status-icon.error {
      background: rgba(239,68,68,0.12);
      border: 2px solid var(--error);
    }
    .status-icon.error svg { fill: var(--error); }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .status-text {
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      color: var(--text-primary);
    }

    .status-subtext {
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
      margin-top: 6px;
    }

    .coords-display {
      margin-top: 16px;
      padding: 10px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 12px;
      color: var(--text-secondary);
      display: none;
      box-shadow: var(--shadow);
    }
    .coords-display.visible { display: block; }

    /* Bottom Controls */
    .bottom-controls {
      padding: 16px 0 32px;
      padding-bottom: max(32px, env(safe-area-inset-bottom));
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    .chat-chips {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .chat-chip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      box-shadow: var(--shadow);
    }
    .chat-chip:active { transform: scale(0.97); }
    .chat-chip.selected {
      background: rgba(47,198,246,0.12);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    .chat-chip .chip-badge {
      background: var(--accent);
      color: #fff;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      padding: 1px 7px;
      display: none;
    }
    .chat-chip .chip-badge.visible { display: inline-block; }

    /* Main Button */
    .main-button {
      width: 100%;
      padding: 20px;
      background: var(--accent);
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 14px rgba(47,198,246,0.35);
    }
    .main-button:active { transform: scale(0.98); background: var(--accent-hover); }
    .main-button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    .main-button.loading { position: relative; color: transparent; }
    .main-button.loading::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 24px; height: 24px;
      margin: -12px 0 0 -12px;
      border: 3px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .helper-text {
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 14px;
    }

    .footer {
      text-align: center;
      padding: 16px 0;
      font-size: 11px;
      color: var(--text-secondary);
      border-top: 1px solid var(--border);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }

    .modal {
      background: var(--card);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 480px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.25s ease;
      overflow: hidden;
    }
    .modal-overlay.open .modal { transform: translateY(0); }

    .modal-header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-title { font-size: 16px; font-weight: 700; color: var(--text-primary); }
    .modal-close {
      width: 32px; height: 32px;
      border: none; background: var(--bg);
      border-radius: 50%; cursor: pointer;
      font-size: 18px; color: var(--text-secondary);
      display: flex; align-items: center; justify-content: center;
    }

    .modal-search {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .modal-search input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      color: var(--text-primary);
      background: var(--bg);
      outline: none;
    }
    .modal-search input:focus { border-color: var(--accent); }

    .modal-list { overflow-y: auto; flex: 1; }

    .modal-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      -webkit-tap-highlight-color: transparent;
    }
    .modal-item:last-child { border-bottom: none; }
    .modal-item:active { background: var(--bg); }

    .modal-item .avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: rgba(47,198,246,0.15);
      color: var(--accent);
      font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .modal-item .item-name {
      flex: 1;
      font-size: 14px;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .modal-item .item-check {
      width: 22px; height: 22px;
      border: 2px solid var(--border);
      border-radius: 6px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-item.selected .item-check {
      background: var(--accent);
      border-color: var(--accent);
    }
    .modal-item.selected .item-check::after {
      content: '✓';
      color: #fff;
      font-size: 13px;
      font-weight: bold;
    }

    .modal-loading {
      padding: 32px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      padding-bottom: max(14px, env(safe-area-inset-bottom));
    }
    .modal-confirm {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
    }
    .modal-confirm:active { background: var(--accent-hover); }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-title">
        <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
        Enviar Localização
      </div>
      <div class="header-greeting" id="greeting">DS Tech — Técnicos de Campo</div>
      <div class="name-input-wrapper" id="nameInputWrapper">
        <input type="text" id="nameInput" placeholder="Digite seu nome">
      </div>
    </header>

    <div class="status-area">
      <div class="status-icon idle" id="statusIcon">
        <svg id="iconIdle" viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
        <svg id="iconLocating" style="display:none" viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
        <svg id="iconSending" style="display:none" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        <svg id="iconSuccess" style="display:none" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        <svg id="iconError" style="display:none" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
      </div>
      <div class="status-text" id="statusText">Aguardando</div>
      <div class="status-subtext" id="statusSubtext">Toque no botão para enviar sua localização</div>
      <div class="coords-display" id="coordsDisplay"></div>
    </div>

    <div class="bottom-controls">
      <div class="section-label">Enviar para</div>
      <div class="chat-chips">
        <div class="chat-chip selected" id="chipDefault" data-id="chat6401">
          DSTech | Infraestrutura
        </div>
        <div class="chat-chip" id="chipOutros">
          <span>📤 Outros chats...</span>
          <span class="chip-badge" id="badgeOutros"></span>
        </div>
      </div>

      <button class="main-button" id="mainButton">Capturar e Enviar GPS</button>
      <div class="helper-text" id="helperText">Toque no botão para enviar sua localização</div>
    </div>

    <footer class="footer">Desenvolvido para uso em campo</footer>
  </div>

  <!-- Modal de seleção de chats -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Selecionar destinos</span>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-search">
        <input type="search" id="searchChat" placeholder="Buscar conversa..." autocomplete="off">
      </div>
      <div class="modal-list" id="modalList">
        <div class="modal-loading">Carregando conversas…</div>
      </div>
      <div class="modal-footer">
        <button class="modal-confirm" id="modalConfirm">Confirmar</button>
      </div>
    </div>
  </div>

  <script>
    const WEBHOOK = 'https://dstech.bitrix24.com.br/rest/249/ekxs4uynroohw0ry'
    const DEFAULT_CHAT_ID = 'chat6401'

    const greeting     = document.getElementById('greeting')
    const nameInputWrapper = document.getElementById('nameInputWrapper')
    const nameInput    = document.getElementById('nameInput')
    const statusIcon   = document.getElementById('statusIcon')
    const statusText   = document.getElementById('statusText')
    const statusSubtext = document.getElementById('statusSubtext')
    const coordsDisplay = document.getElementById('coordsDisplay')
    const mainButton   = document.getElementById('mainButton')
    const helperText   = document.getElementById('helperText')
    const chipDefault  = document.getElementById('chipDefault')
    const chipOutros   = document.getElementById('chipOutros')
    const badgeOutros  = document.getElementById('badgeOutros')
    const modalOverlay = document.getElementById('modalOverlay')
    const modalClose   = document.getElementById('modalClose')
    const modalList    = document.getElementById('modalList')
    const modalConfirm = document.getElementById('modalConfirm')
    const searchChat   = document.getElementById('searchChat')

    let bitrixUserName = null
    let extraChats = []       // [{id, name, isGroup}]
    let allChats   = []
    let pendingChats = []
    let defaultSelected = true

    // ── Recebe usuário via postMessage ─────────────────────────
    window.addEventListener('message', e => {
      if (e.data && e.data.type === 'BITRIX_USER' && e.data.name) {
        bitrixUserName = e.data.name
        greeting.textContent = `Olá, ${bitrixUserName}`
        nameInputWrapper.classList.remove('visible')
      }
    })

    // Se em 800ms não recebeu, mostra input manual
    setTimeout(() => {
      if (!bitrixUserName) {
        greeting.textContent = 'Identifique-se para continuar'
        nameInputWrapper.classList.add('visible')
      }
    }, 800)

    // ── Status visual ──────────────────────────────────────────
    function setStatus(state, text, subtext) {
      document.querySelectorAll('#statusIcon svg').forEach(s => s.style.display = 'none')
      statusIcon.className = 'status-icon ' + state
      document.getElementById('icon' + state.charAt(0).toUpperCase() + state.slice(1)).style.display = 'block'
      statusText.textContent = text
      statusSubtext.textContent = subtext
    }

    function showCoords(lat, lng, accuracy) {
      coordsDisplay.textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)} (±${Math.round(accuracy)}m)`
      coordsDisplay.classList.add('visible')
    }
    function hideCoords() { coordsDisplay.classList.remove('visible') }

    // ── Chips ──────────────────────────────────────────────────
    chipDefault.addEventListener('click', () => {
      defaultSelected = !defaultSelected
      chipDefault.classList.toggle('selected', defaultSelected)
    })

    chipOutros.addEventListener('click', openModal)

    // ── Modal de chats ─────────────────────────────────────────
    function renderList(filter = '') {
      const term = filter.toLowerCase()
      const items = allChats.filter(c => c.name.toLowerCase().includes(term))

      if (!items.length) {
        modalList.innerHTML = '<div class="modal-loading">Nenhuma conversa encontrada</div>'
        return
      }

      modalList.innerHTML = items.map(c => {
        const sel = pendingChats.some(p => p.id === c.id)
        const icon = c.isGroup ? '👥' : '👤'
        return `
          <div class="modal-item ${sel ? 'selected' : ''}" data-id="${c.id}" data-name="${c.name.replace(/"/g,'&quot;')}" data-group="${c.isGroup ? '1' : '0'}">
            <div class="avatar">${icon}</div>
            <span class="item-name">${c.name}</span>
            <div class="item-check"></div>
          </div>`
      }).join('')

      modalList.querySelectorAll('.modal-item').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.dataset.id
          const name = el.dataset.name
          const isGroup = el.dataset.group === '1'
          const idx = pendingChats.findIndex(p => p.id === id)
          if (idx >= 0) {
            pendingChats.splice(idx, 1)
            el.classList.remove('selected')
          } else {
            pendingChats.push({ id, name, isGroup })
            el.classList.add('selected')
          }
        })
      })
    }

    async function loadChats() {
      modalList.innerHTML = '<div class="modal-loading">Carregando conversas…</div>'
      try {
        const [recentRes, groupsRes] = await Promise.all([
          fetch(`${WEBHOOK}/im.recent.list.json?LIMIT=100`).then(r => r.json()).catch(() => ({})),
          fetch(`${WEBHOOK}/im.chat.get.list.json?LIMIT=100`).then(r => r.json()).catch(() => ({}))
        ])

        const map = new Map()

        const recent = recentRes.result?.items || []
        recent.forEach(i => {
          if (!i.title) return
          const isGroup = !!i.chat_id
          const id = isGroup ? `chat${i.chat_id}` : `dialog${i.id}`
          map.set(id, { id, name: i.title, isGroup })
        })

        const groups = groupsRes.result || []
        groups.forEach(g => {
          if (!g.title || !g.id) return
          const id = `chat${g.id}`
          if (!map.has(id)) map.set(id, { id, name: g.title, isGroup: true })
        })

        allChats = Array.from(map.values()).sort((a, b) => a.name.localeCompare(b.name))
        renderList(searchChat.value)
      } catch {
        modalList.innerHTML = '<div class="modal-loading">Erro ao carregar conversas</div>'
      }
    }

    function openModal() {
      pendingChats = [...extraChats]
      modalOverlay.classList.add('open')
      if (!allChats.length) loadChats()
      else renderList(searchChat.value)
    }

    function closeModal() { modalOverlay.classList.remove('open') }

    modalClose.addEventListener('click', closeModal)
    modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal() })
    searchChat.addEventListener('input', () => renderList(searchChat.value))

    modalConfirm.addEventListener('click', () => {
      extraChats = [...pendingChats]
      closeModal()
      if (extraChats.length) {
        badgeOutros.textContent = extraChats.length
        badgeOutros.classList.add('visible')
        chipOutros.classList.add('selected')
      } else {
        badgeOutros.classList.remove('visible')
        chipOutros.classList.remove('selected')
      }
    })

    // ── Envio de GPS ────────────────────────────────────────────
    mainButton.addEventListener('click', async function () {
      const technician = bitrixUserName || (nameInput.value || '').trim()

      if (!technician) {
        setStatus('error', 'Erro', 'Digite seu nome para continuar')
        helperText.textContent = 'Nome é obrigatório'
        setTimeout(() => setStatus('idle', 'Aguardando', 'Toque no botão para enviar sua localização'), 3000)
        return
      }

      const dialogIds = []
      if (defaultSelected) dialogIds.push(DEFAULT_CHAT_ID)
      extraChats.forEach(c => { if (!dialogIds.includes(c.id)) dialogIds.push(c.id) })

      if (!dialogIds.length) {
        setStatus('error', 'Erro', 'Selecione pelo menos um destino')
        helperText.textContent = 'Selecione ao menos um destino'
        setTimeout(() => setStatus('idle', 'Aguardando', 'Toque no botão para enviar sua localização'), 3000)
        return
      }

      mainButton.disabled = true
      mainButton.classList.add('loading')
      hideCoords()
      setStatus('locating', 'Obtendo GPS...', 'Aguarde enquanto capturamos sua localização')

      try {
        const position = await new Promise((resolve, reject) =>
          navigator.geolocation.getCurrentPosition(resolve, reject, {
            enableHighAccuracy: true, timeout: 30000, maximumAge: 0
          })
        )

        const { latitude: lat, longitude: lng, accuracy } = position.coords
        showCoords(lat, lng, accuracy)
        setStatus('sending', 'Enviando...', 'Transmitindo localização para o servidor')

        const response = await fetch('/api/send-location', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ technician, lat, lng, accuracy, dialogIds })
        })

        if (!response.ok) throw new Error('Erro ao enviar localização')

        setStatus('success', 'Enviado!', `Localização enviada para ${dialogIds.length} destino(s)`)
        helperText.textContent = 'Localização enviada com sucesso'

        setTimeout(() => {
          setStatus('idle', 'Aguardando', 'Toque no botão para enviar sua localização')
          hideCoords()
          mainButton.disabled = false
          mainButton.classList.remove('loading')
          helperText.textContent = 'Toque no botão para enviar sua localização'
        }, 5000)

      } catch (error) {
        const msg = error.code === 1 ? 'Permissão de localização negada'
                  : error.code === 2 ? 'Não foi possível obter a localização'
                  : error.code === 3 ? 'Tempo esgotado ao obter localização'
                  : error.message || 'Ocorreu um erro inesperado'

        setStatus('error', 'Erro', msg)
        helperText.textContent = 'Tente novamente'
        mainButton.disabled = false
        mainButton.classList.remove('loading')

        setTimeout(() => setStatus('idle', 'Aguardando', 'Toque no botão para enviar sua localização'), 5000)
      }
    })
  </script>
</body>
</html>
