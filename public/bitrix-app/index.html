<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSField</title>
<script src="//api.bitrix24.com/api/v1/"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; background: #f5f7fa; }
iframe { width: 100%; height: 100vh; border: none; display: block; }
</style>
</head>
<body>
<iframe id="gpsFrame" src="https://bot-location.vercel.app/gps-tracker.html" allow="geolocation *"></iframe>
<script>
BX24.init(function() {
  BX24.callMethod('profile', {}, function(result) {
    const user = result.data()
    if (!user) return

    const name = (user.NAME + ' ' + (user.LAST_NAME || '')).trim()
    const id = user.ID

    const frame = document.getElementById('gpsFrame')

    function sendUser() {
      frame.contentWindow.postMessage({
        type: 'BITRIX_USER',
        name: name,
        id: id
      }, '*')
    }

    // Envia agora (caso iframe já esteja carregado)
    try { sendUser() } catch(e) {}

    // Envia quando carregar
    frame.addEventListener('load', function() {
      try { sendUser() } catch(e) {}
    })

    // Fallback após 1s e 2s
    setTimeout(sendUser, 1000)
    setTimeout(sendUser, 2000)
  })

  BX24.callMethod('placement.unbind', {
    PLACEMENT: 'IM_TOOLBAR',
    HANDLER: 'https://bot-location.vercel.app/gps-tracker.html'
  }, function() {
    BX24.callMethod('placement.bind', {
      PLACEMENT: 'IM_TOOLBAR',
      HANDLER: 'https://bot-location.vercel.app/gps-tracker.html',
      TITLE: 'Enviar GPS'
    }, function(result) {
      console.log('placement.bind IM_TOOLBAR:', JSON.stringify(result.data()))
    })
  })
})
</script>
</body>
</html>
